name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GCC
        run: gcc -Wall -Wextra -O2 src/main.c src/devices.c -o serial-tool.exe -lsetupapi -ldevguid
      - name: Verify binary
        run: test -f serial-tool.exe && echo "build OK"
        shell: bash
